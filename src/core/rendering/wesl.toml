# WESL Configuration for SpectralCompute shader modules
# This file defines which shader files to include for the WESL linker

# Edition of WESL to use
edition = "unstable_2025"

# Root directory for module resolution (relative to this file)
root = "."

# Include patterns for shader files (relative to this file's directory)
include = ["*.wesl", "wgsl/**/*.wesl"]

# Automatically discover dependencies from imports
dependencies = "auto"
